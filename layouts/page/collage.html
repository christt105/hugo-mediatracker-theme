{{ define "main" }}
<script src="https://unpkg.com/html2canvas-pro@1.6.2/dist/html2canvas-pro.min.js"></script>

<div class="collage-wrapper">

    <button class="collage-controls-toggle" id="controls-toggle" aria-expanded="true" aria-controls="collage-controls-panel">
        <i class="fas fa-sliders-h"></i> <span id="toggle-label">Hide Controls</span>
    </button>

    <aside class="collage-controls" id="collage-controls-panel">
        <h2>Collage Settings</h2>

        <div class="control-group">
            <label>📅 From:</label>
            <input type="date" id="start-date">
        </div>

        <div class="control-group">
            <label>📅 To:</label>
            <input type="date" id="end-date">
        </div>

        <div class="control-group">
            <label>Type:</label>
            <div class="checkbox-wrapper">
                <label><input type="checkbox" value="movie" checked> Movies</label>
                <label><input type="checkbox" value="tv" checked> Series</label>
                <label><input type="checkbox" value="videogame" checked> Games</label>
            </div>
        </div>

        <div class="control-group">
            <label>Columns: <span id="col-val">5</span></label>
            <input type="range" id="columns-range" min="2" max="20" value="5">
        </div>

        <div class="control-stats">
            Items found: <strong id="count-display">0</strong>
        </div>

        <button id="download-btn" class="btn-download">
            <i class="fas fa-download"></i> Download PNG
        </button>
    </aside>

    <div class="collage-preview-area">
        <div class="canvas-scaler">
            <div id="collage-canvas"></div>
        </div>
    </div>

</div>

<style>
    .collage-wrapper {
        display: flex;
        flex-direction: row;
        gap: 20px;
        padding: 16px;
        max-width: 100%;
        margin: 70px auto 0;
        height: calc(100vh - 90px);
        box-sizing: border-box;
        position: relative;
    }

    .collage-controls-toggle {
        display: none;
    }

    .collage-controls {
        flex: 0 0 280px;
        background: rgb(50, 50, 50);
        padding: 20px;
        border-radius: 12px;
        overflow-y: auto;
        max-height: 100%;
    }

    .collage-controls h2 {
        margin: 0 0 16px;
        font-size: 1.1rem;
    }

    .control-group {
        margin-bottom: 18px;
    }

    .control-group label {
        display: block;
        font-weight: bold;
        margin-bottom: 6px;
        font-size: 0.9rem;
    }

    .checkbox-wrapper label {
        display: block;
        font-weight: normal;
        margin-bottom: 5px;
        cursor: pointer;
        font-size: 0.9rem;
    }

    input[type="date"],
    input[type="range"] {
        width: 100%;
        padding: 6px 8px;
        border-radius: 6px;
        border: 1px solid rgba(128,128,128,0.4);
        box-sizing: border-box;
        background: rgba(0,0,0,0.3);
        color: inherit;
    }

    .control-stats {
        font-size: 0.85rem;
        margin-bottom: 16px;
        opacity: 0.75;
    }

    .btn-download {
        width: 100%;
        padding: 12px;
        background: #3b82f6;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 1rem;
        cursor: pointer;
        transition: opacity 0.2s;
    }

    .btn-download:hover {
        opacity: 0.85;
    }

    .collage-preview-area {
        flex: 1;
        background: #2a2a2a;
        padding: 16px;
        border-radius: 12px;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        min-height: 200px;
    }

    .canvas-scaler {
        transform-origin: center center;
        transition: transform 0.3s ease;
    }

    #collage-canvas {
        background: black;
        display: grid;
        gap: 0;
        width: fit-content;
        box-shadow: 0 0 50px rgba(0, 0, 0, 0.8);
    }

    .collage-item {
        width: 600px;
        aspect-ratio: 2/3;
        overflow: hidden;
        position: relative;
    }

    .collage-item img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
    }

    /* Mobile layout */
    @media (max-width: 768px) {
        .collage-wrapper {
            flex-direction: column;
            height: auto;
            margin-top: 60px;
            padding: 10px;
            gap: 10px;
        }

        .collage-controls-toggle {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 14px;
            background: rgb(50, 50, 50);
            border: none;
            border-radius: 8px;
            color: inherit;
            font-size: 0.95rem;
            cursor: pointer;
            width: 100%;
            justify-content: center;
        }

        .collage-controls {
            flex: none;
            max-height: none;
            transition: max-height 0.3s ease, padding 0.3s ease, opacity 0.3s ease;
            overflow: hidden;
        }

        .collage-controls.is-collapsed {
            max-height: 0 !important;
            padding-top: 0;
            padding-bottom: 0;
            opacity: 0;
        }

        .collage-preview-area {
            height: auto;
            min-height: 120px;
            align-items: flex-start;
        }
    }
</style>

<script>
    let allMedia = [];

    const canvas = document.getElementById('collage-canvas');
    const scaler = document.querySelector('.canvas-scaler');
    const previewArea = document.querySelector('.collage-preview-area');
    const controlsPanel = document.getElementById('collage-controls-panel');
    const toggleBtn = document.getElementById('controls-toggle');
    const toggleLabel = document.getElementById('toggle-label');

    const startDateInput = document.getElementById('start-date');
    const endDateInput = document.getElementById('end-date');
    const columnsInput = document.getElementById('columns-range');
    const colValDisplay = document.getElementById('col-val');
    const countDisplay = document.getElementById('count-display');

    // Set default columns based on screen width
    if (window.innerWidth <= 768) {
        columnsInput.value = 3;
    }

    // Controls toggle for mobile
    toggleBtn.addEventListener('click', function() {
        const collapsed = controlsPanel.classList.toggle('is-collapsed');
        toggleBtn.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
        toggleLabel.textContent = collapsed ? 'Show Controls' : 'Hide Controls';
    });

    fetch('{{ "index.json" | relURL }}')
        .then(response => response.json())
        .then(data => {
            allMedia = data;

            const today = new Date();
            const startOfYear = new Date(today.getFullYear(), 0, 2);
            startDateInput.valueAsDate = startOfYear;
            endDateInput.valueAsDate = today;

            renderCollage();

            window.addEventListener('resize', fitPreviewToScreen);
        });

    function renderCollage() {
        const start = new Date(startDateInput.value);
        const end = new Date(endDateInput.value);

        let columns = parseInt(columnsInput.value);

        const checkedTypes = Array.from(document.querySelectorAll('.checkbox-wrapper input:checked')).map(cb => cb.value);

        if (checkedTypes.includes("tv")) {
            checkedTypes.push("season");
        }

        const filtered = allMedia.filter(item => {
            if (!checkedTypes.includes(item.type)) return false;

            if (item.date) {
                const itemDate = new Date(item.date);
                const endOfDay = new Date(end);
                endOfDay.setHours(23, 59, 59);
                return itemDate >= start && itemDate <= endOfDay;
            }
            return false;
        });

        if (filtered.length > 0 && filtered.length < columns) {
            columns = filtered.length;
        }

        countDisplay.innerText = filtered.length;
        colValDisplay.innerText = columnsInput.value;

        const isMobile = window.innerWidth <= 768;
        const itemWidth = isMobile
            ? Math.floor((previewArea.clientWidth - 32) / columns)
            : 600;

        canvas.style.gridTemplateColumns = `repeat(${columns}, ${itemWidth}px)`;
        canvas.innerHTML = '';

        filtered.forEach(item => {
            const div = document.createElement('div');
            div.className = 'collage-item';
            div.style.width = itemWidth + 'px';
            div.innerHTML = `<img src="${item.image}" alt="${item.title}" crossorigin="anonymous" loading="eager">`;
            canvas.appendChild(div);
        });

        if (isMobile) {
            scaler.style.transform = 'none';
        } else {
            setTimeout(fitPreviewToScreen, 100);
        }
    }

    function fitPreviewToScreen() {
        if (!canvas.firstChild || window.innerWidth <= 768) return;

        const containerWidth = previewArea.clientWidth - 32;
        const containerHeight = previewArea.clientHeight - 32;

        const contentWidth = canvas.scrollWidth;
        const contentHeight = canvas.scrollHeight;

        const scaleX = containerWidth / contentWidth;
        const scaleY = containerHeight / contentHeight;

        let scale = Math.min(scaleX, scaleY);

        if (scale > 1) scale = 1;

        scaler.style.transform = `scale(${scale})`;
    }

    [startDateInput, endDateInput, columnsInput].forEach(el => {
        el.addEventListener('change', renderCollage);
        el.addEventListener('input', renderCollage);
    });

    document.querySelectorAll('.checkbox-wrapper input').forEach(el => {
        el.addEventListener('change', renderCollage);
    });

    document.getElementById('download-btn').addEventListener('click', () => {
        const btn = document.getElementById('download-btn');
        const originalText = btn.innerHTML;

        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Generating...';
        btn.disabled = true;

        html2canvas(canvas, {
            useCORS: true,
            allowTaint: true,
            scale: 1,
            backgroundColor: null,
            logging: false,
            onclone: (clonedDoc) => {
                const clonedCanvas = clonedDoc.getElementById('collage-canvas');
                const clonedScaler = clonedDoc.querySelector('.canvas-scaler');

                if(clonedScaler) {
                    clonedScaler.style.transform = 'none';
                    clonedScaler.style.margin = '0';
                    clonedScaler.style.padding = '0';
                }

                clonedCanvas.style.overflow = 'visible';
                clonedCanvas.style.maxWidth = 'none';
                clonedCanvas.style.height = 'auto';
            }
        }).then(renderedCanvas => {
            renderedCanvas.toBlob(function(blob) {
                if (!blob) {
                    alert("Error: Image is too large for the browser.");
                    btn.innerHTML = originalText;
                    btn.disabled = false;
                    return;
                }

                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.download = `MediaTracker_${new Date().toISOString().slice(0, 10)}.png`;
                link.href = url;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);

                setTimeout(() => URL.revokeObjectURL(url), 1000);

                btn.innerHTML = originalText;
                btn.disabled = false;
            }, 'image/png');

        }).catch(err => {
            console.error("Canvas Error:", err);
            btn.innerHTML = 'Error :(';
            setTimeout(() => {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }, 2000);
        });
    });
</script>
{{ end }}
